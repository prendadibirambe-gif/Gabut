<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Auto Loop Bad Apple Video</title>
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        video {
            max-width: 100%;
            max-height: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Atribut 'loop' membuat video otomatis mengulang dari awal saat selesai -->
    <!-- Atribut 'autoplay' membuat video langsung berjalan (beberapa browser mewajibkan 'muted' agar autoplay bekerja) -->
    <!-- Atribut 'controls' memunculkan tombol play/pause bawaan browser -->
    <video crossorigin="anonymous" loop autoplay muted controls>
        <source src="https://raw.githubusercontent.com/trung-kieen/bad-apple-ascii/main/bad_apple.mp4" type="video/mp4">
        Browser Anda tidak mendukung pemutaran video ini.
    </video>

</body>
</html>
